services:
    postgres-service:
        image: postgres:17.9-alpine3.22
        env_file:
            - .env.dev
        environment:
            POSTGRES_DB: ${DB_NAME}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        ports:
            - '${DB_PORT}:5432'
        volumes:
            - postgres-service-data:/var/lib/postgresql/data

    redis-service:
        image: redis:8.6.3-alpine
        env_file:
            - .env.dev
        command: redis-server
        ports:
            - '${REDIS_PORT}:6379'
        volumes:
            - redis-service-data:/data
        restart: unless-stopped

    pi-backend:
        build:
            context: .
            dockerfile: Dockerfile.dev-hybrid
        env_file:
            - .env.dev
        depends_on:
            - postgres-service
            - redis-service
        ports:
            - '${PORT}:${PORT}'

volumes:
    postgres-service-data:
    redis-service-data:
